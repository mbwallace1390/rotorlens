version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      android-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/firebase
    schedule:
      interval: monthly
    groups:
      firebase-emulator:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/firebase/functions
    schedule:
      interval: monthly
    groups:
      firebase-functions:
        patterns: ["*"]
