version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # A major release of anything in the Android build is a migration, not a
    # bump: it needs regenerated dependency-verification metadata, the
    # provenance hash pins, notices and legal output, and a real-handset check,
    # none of which Dependabot can do. Ignoring only the Android Gradle Plugin
    # and Gradle wrapper majors (#22) just moved the rest into their own
    # unmergeable PRs: kotlin-stdlib 1.8 -> 2.4 (#23, #25) and foojay 0.10 -> 1.0
    # (#24). Take every Gradle major by hand; minor and patch updates keep
    # flowing below, and still need the verification metadata regenerated.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      android-runtime:
        patterns: ["*"]
        # Any other major update arrives as its own PR rather than riding in
        # this one and holding the routine updates hostage with it.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /backend/firebase
    schedule:
      interval: monthly
    groups:
      firebase-emulator:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/firebase/functions
    schedule:
      interval: monthly
    groups:
      firebase-functions:
        patterns: ["*"]
