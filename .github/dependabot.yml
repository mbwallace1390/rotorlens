version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    # A major Android Gradle Plugin or Gradle wrapper release is a migration, not
    # a bump: it needs regenerated dependency-verification metadata, the
    # provenance hash pins, notices and legal output, a gradlew.bat renormalize
    # and a real-handset check, none of which Dependabot can do. Grouped with
    # everything else, it made the whole android-runtime PR unmergeable; #7 was
    # Dependabot's fourth attempt at it, after #1 and #3. Take those majors by
    # hand; minor and patch updates keep flowing below.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
    groups:
      android-runtime:
        patterns: ["*"]
        # Any other major update arrives as its own PR rather than riding in
        # this one and holding the routine updates hostage with it.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /backend/firebase
    schedule:
      interval: monthly
    groups:
      firebase-emulator:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /backend/firebase/functions
    schedule:
      interval: monthly
    groups:
      firebase-functions:
        patterns: ["*"]
