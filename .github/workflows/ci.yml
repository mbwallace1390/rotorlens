# RotorLens CI
#
# Six jobs, run on pushes to main, every pull request and on manual dispatch.
# Feature branches are verified by their pull request so one commit does not
# create a duplicate push run that gets cancelled and leaves false-red checks.
#
# The compliance job is the one that earns its keep. `provenance`,
# `privacy-claims`, `legal-disclaimer` and `check-donation` encode promises made
# to Google Play and to Apple, and they rot silently — the moment they matter is
# a store submission, which is exactly the moment nobody remembers to run them.
# A machine running them on every push is worth more than an intention to.
#
# WHAT THIS CANNOT DO. Every bug that mattered in the UI work was found on the
# handset, not here: a sticky header burying the answer it was scrolled to, a
# heading write deleting a fold button, a picker at a 0 px touch target. A
# runner's Chrome has desktop width and no safe-area insets. This is a
# regression net. `.claude/skills/device-check/SKILL.md` is still how phone
# behaviour gets verified.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Every job only needs to read the checkout. Keep the implicit GITHUB_TOKEN from
# acquiring repository write permissions through a changed organization default.
permissions:
  contents: read

# A second push to the same branch retires the first run rather than queueing
# behind it. Private-repo Actions minutes are finite and the browser tests are
# not fast.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      # No `npm ci`, and that is not an omission. The project has no npm or
      # Cargo dependencies at all — `docs/LICENSING_AND_STORE_READINESS.md`
      # says so and `npm test` enforces it. Adding an install step here would
      # quietly make that untrue the first time someone added a dev dependency.

      # The suite drives the DevTools protocol against any Chromium and already
      # looks in `/usr/bin/google-chrome`, which is where ubuntu-latest keeps
      # it. Passed explicitly anyway, so a runner image that moves it fails
      # loudly here rather than skipping the browser tests and reporting green.
      - name: Check Chrome is present
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version

      - name: Verify DCO sign-offs
        run: npm run check:dco

      - name: Run the suite
        env:
          ROTORLENS_BROWSER: /usr/bin/google-chrome
        run: |
          npm run check:syntax
          npm test

      - name: Refuse unpublishable real fixtures
        run: npm run check:donation -- --allow-empty fixtures/real

  generated:
    name: generated files match their generators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # The legal text, the privacy page and the synthetic fixtures are all
      # committed AND generated. Committed output that has drifted from its
      # generator is the failure mode that matters: the file a reviewer reads
      # and the file the tool would produce stop being the same document, and
      # nothing says so.
      - name: Regenerate
        run: |
          npm run legal:generate
          npm run privacy:generate
          npm run fixtures:generate

      - name: Nothing should have changed
        run: |
          if ! git diff --exit-code; then
            echo "::error::A committed file differs from what its generator produces."
            echo "Run the three generate scripts locally and commit the result."
            exit 1
          fi

  firebase-emulator:
    name: Firebase emulator backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'jetbrains'
          java-version: '21'

      # This is a separate dependency boundary. The shared/mobile root remains
      # dependency-free, and no Firebase SDK is packaged into Android or iOS.
      - name: Install exact emulator and Functions dependencies
        run: |
          npm ci --ignore-scripts --prefix backend/firebase
          npm ci --ignore-scripts --prefix backend/firebase/functions

      # High/critical advisories fail the build. Current upstream Firebase
      # graphs also carry documented moderate transitive advisories; do not use
      # `--force` to downgrade the pinned top-level SDKs around them.
      - name: Audit the isolated dependency graphs
        run: |
          npm audit --audit-level=high --prefix backend/firebase
          npm audit --omit=dev --audit-level=high --prefix backend/firebase/functions

      - name: Run the local-only Firestore and Functions proof
        run: npm test --prefix backend/firebase

  firmware-binding-candidate:
    name: firmware binding partial candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_COMMIT: 118e9120260bb33f46df4f92052fb0e9fd4e9ebc
      BASE_TREE: 7821f5ac9c18da9fb31844b3a9be4b1a77caac11
      RESULT_TREE: 635c01e76fad457114bfbc8a11a7a42e2e115518
      PATCH_PATH: integration/rotorflight-firmware/binding-v1/patches/rotorflight-4.6.0-binding-v1-partial.patch
      PATCH_SHA256: 0bcb2f89bc9b6af3b2953952a3e015954511c71a8c718fd0b022cde47594cb6f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false

      # The focused Node tests keep every production caller and positive
      # registry absent. The inline check ties the workflow's immutable source
      # pins to the manifest and to the exact patch bytes before a second
      # repository is fetched.
      - name: Verify the closed non-runtime artifact
        run: |
          node --test test/firmware-binding-integration.test.mjs test/community-config-binding-protocol.test.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {readFileSync} from 'node:fs';
          import path from 'node:path';

          const artifactRoot = path.join(
            'integration', 'rotorflight-firmware', 'binding-v1');
          const manifest = JSON.parse(readFileSync(
            path.join(artifactRoot, 'artifact-manifest.json'), 'utf8'));
          assert.equal(manifest.baseCommit, process.env.BASE_COMMIT);
          assert.equal(manifest.baseTree, process.env.BASE_TREE);
          assert.equal(manifest.resultTree, process.env.RESULT_TREE);
          assert.equal(
            path.posix.join(artifactRoot.replaceAll('\\', '/'), manifest.patch.path),
            process.env.PATCH_PATH);
          assert.equal(manifest.patch.sha256, process.env.PATCH_SHA256);
          const patch = readFileSync(process.env.PATCH_PATH);
          assert.equal(patch.length, manifest.patch.byteLength);
          assert.equal(
            createHash('sha256').update(patch).digest('hex'),
            process.env.PATCH_SHA256);
          assert.equal(manifest.implementationCommit, null);
          assert.deepEqual(manifest.targets, []);
          assert.deepEqual(manifest.manifestIds.runtimeAccepted, []);
          assert.equal(manifest.candidateEncoding.fullPreimage, false);
          assert.equal(manifest.candidateEncoding.liveFirmwareRead, false);
          const semanticValidation = manifest.candidateEncoding.semanticValidation;
          assert.equal(semanticValidation.provesLiveOrigin, false);
          assert.equal(semanticValidation.provesStableCapture, false);
          const mutationEpoch = manifest.candidateMutationEpoch;
          assert.deepEqual(mutationEpoch.productionCallers, []);
          assert.deepEqual(mutationEpoch.writerHookCoverage, []);
          assert.equal(mutationEpoch.captureIntegration, false);
          assert.equal(mutationEpoch.provesStableCapture, false);
          assert.equal(manifest.evidence.resourceBounds, null);
          assert.equal(manifest.evidence.terminalAtomicity, null);
          assert.deepEqual(manifest.evidence.wireCaptures, []);
          assert.equal(manifest.runtimeAcceptance, false);
          NODE

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rotorflight/rotorflight-firmware
          ref: 118e9120260bb33f46df4f92052fb0e9fd4e9ebc
          path: upstream-firmware
          fetch-depth: 1
          persist-credentials: false

      - name: Apply only the exact source overlay
        shell: bash
        run: |
          test "$(git -C upstream-firmware rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git -C upstream-firmware rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          test "$(git -C upstream-firmware rev-parse --show-object-format)" = sha1
          test -z "$(git -C upstream-firmware status --porcelain=v1 --untracked-files=all)"

          patch="$GITHUB_WORKSPACE/$PATCH_PATH"
          git -C upstream-firmware apply --check --index --whitespace=error-all "$patch"
          git -C upstream-firmware apply --index --whitespace=error-all "$patch"
          git -C upstream-firmware diff --cached --check
          git -C upstream-firmware diff --quiet

          diff -u \
            <(printf '%s\n' \
              $'A\tsrc/main/common/sha256.c' \
              $'A\tsrc/main/common/sha256.h' \
              $'A\tsrc/main/config/rotorlens_binding_manifest.c' \
              $'A\tsrc/main/config/rotorlens_binding_manifest.h' \
              $'A\tsrc/main/config/rotorlens_config_mutation_epoch.c' \
              $'A\tsrc/main/config/rotorlens_config_mutation_epoch.h' \
              $'M\tsrc/test/Makefile' \
              $'A\tsrc/test/unit/rotorlens_binding_manifest_unittest.cc' \
              $'A\tsrc/test/unit/rotorlens_config_mutation_epoch_unittest.cc' \
              $'A\tsrc/test/unit/sha256_unittest.cc') \
            <(git -C upstream-firmware diff --cached --name-status --no-renames)

          # No production code outside the isolated module may call the epoch
          # yet. The config source wildcard compiles the C file, so this proves
          # absence of callers/hooks, not absence from a target source list.
          diff -u \
            <(printf '%s\n' \
              'src/main/config/rotorlens_config_mutation_epoch.c' \
              'src/main/config/rotorlens_config_mutation_epoch.h') \
            <(git -C upstream-firmware grep -l \
              'rotorlensConfigMutationEpoch' -- src/main)
          test "$(git -C upstream-firmware write-tree)" = "$RESULT_TREE"

      # Clang 18 is preinstalled on the versioned runner. Empty LDFLAGS avoids
      # the upstream all-tests harness's BlocksRuntime and parameter-group
      # linker options; none of these three leaf tests uses either facility.
      - name: Run only the bounded host conformance tests
        shell: bash
        run: |
          clang-18 --version
          clang++-18 --version
          make --version
          make -C upstream-firmware/src/test \
            CC=clang-18 CXX=clang++-18 LDFLAGS= V=1 \
            test_sha256_unittest \
            test_rotorlens_binding_manifest_unittest \
            test_rotorlens_config_mutation_epoch_unittest
          git -C upstream-firmware diff --quiet
          test "$(git -C upstream-firmware write-tree)" = "$RESULT_TREE"

  android:
    name: Android debug + release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # JetBrains 21, matching `android/gradle/gradle-daemon-jvm.properties`,
      # which pins both the version AND the vendor. A temurin runtime satisfies
      # the version and fails the vendor criteria, and Gradle then tries to
      # auto-download a JDK on a runner that should not need to.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Use the open GitHub Actions cache implementation rather than the
          # proprietary enhanced provider that setup-gradle v6 selects by default.
          cache-provider: basic

      # An unsigned release bundle exercises lint-vital, manifest merging and
      # the exact asset graph Play will consume without introducing a signing
      # secret. Debug remains the downloadable tester artifact.
      - name: Build and lint debug and release variants
        working-directory: android
        run: >-
          ./gradlew --dependency-verification strict
          assembleDebug lintDebug testDebugUnitTest bundleRelease
          :app:recordShippingDependencies --no-daemon

      # The committed snapshot is an input to both the notices test and the
      # generated in-app Legal screen. Resolve it on the runner first: otherwise
      # a version-only Gradle update can leave all three files consistently stale
      # and the Node-only generated-files job has no way to discover that.
      - name: Verify resolved dependencies and legal output are committed
        run: |
          npm run legal:generate
          node --test test/provenance.test.mjs test/legal-disclaimer.test.mjs
          if ! git diff --exit-code -- android/shipping-dependencies.json ui/legal-data.mjs; then
            echo "::error::Resolved Android dependencies or generated legal data are stale."
            echo "Run ./gradlew :app:recordShippingDependencies from android/, then npm run legal:generate, and commit both files."
            exit 1
          fi

      - name: Audit the shipped manifest permissions
        run: >-
          npm run check:android-manifest --
          android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml

      # Pull-request code is untrusted and debug-signed output is not an official
      # release. Retain one short-lived tester APK only from the protected default
      # branch; tagged releases use a separate reviewed signing/provenance flow.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows Node + browser
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check a browser is present
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $programFilesX86 'Google\Chrome\Application\chrome.exe'),
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'),
            (Join-Path $programFilesX86 'Microsoft\Edge\Application\msedge.exe')
          )
          $browser = $candidates | Where-Object {
            $_ -and (Test-Path -LiteralPath $_)
          } | Select-Object -First 1
          if (-not $browser) {
            throw 'No supported Chromium browser is installed on the Windows runner.'
          }
          & $browser --version
          "ROTORLENS_BROWSER=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run the suite
        run: |
          npm run check:syntax
          npm test
